# SPDX-License-Identifier: MPL-2.0
name: Documentation Integrity
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  documentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # No marketplace actions: this guard must not depend on the allow-list
      # it helps document. Fetch the event SHA, never an untrusted branch name.
      - name: Fetch event revision
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh api "repos/$REPOSITORY/tarball/$REVISION" > "$RUNNER_TEMP/source.tar.gz"
          tar -xzf "$RUNNER_TEMP/source.tar.gz" --strip-components=1
      - name: Check documentation and regression tests
        run: |
          set -euo pipefail
          node --version
          node scripts/check-repository.mjs
          node --test tests/*.test.mjs
      # Temporary PR repair: regenerate in an authenticated, read-only runner.
      # Remove this step after committing the generated lockfile.
      - name: Generate the Actions dependency lockfile for review
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 38
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_ACTIONS_LOCK_REPO_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          lock_tool="$RUNNER_TEMP/gh-actions-lock"
          curl --fail --location --silent --show-error --output "$lock_tool" \
            https://github.com/github/gh-actions-lock/releases/download/v0.4.1/linux-amd64
          printf '%s  %s\n' \
            39deb2fe714dbf74b073d8245fc7f3d50cd0eee18d5c0900e9e849ae933ae17e \
            "$lock_tool" | sha256sum -c -
          chmod +x "$lock_tool"
          sha256sum .github/workflows/*.yml > "$RUNNER_TEMP/workflows.sha256"
          "$lock_tool" --no-narrow --no-interactive
          "$lock_tool" --verify
          sha256sum --check "$RUNNER_TEMP/workflows.sha256"
          printf 'ACTION_LOCK_BEGIN\n'
          base64 --wrap=0 .github/workflows/actions.lock
          printf '\n'
          printf 'ACTION_LOCK_END\n'
          sha256sum .github/workflows/actions.lock

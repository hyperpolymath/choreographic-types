# SPDX-License-Identifier: MPL-2.0
# Calls the estate's shared secret scanner (gitleaks + rust-secrets +
# shell-secrets).
#
# No `secrets:` line: the reusable workflow declares no secrets and reads
# none, and `secrets: inherit` would forward every secret this repository
# can see (CWE-250; standards#1108 §6b, in the workflow's own header).
name: "Secret Scanner"
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  scan:
    # The same standards commit as scorecard.yml; see the actions.lock header.
    uses: hyperpolymath/standards/.github/workflows/secret-scanner-reusable.yml@75bd5994470661a099df562d6d5ad2fe744dbd66

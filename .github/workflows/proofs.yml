# SPDX-License-Identifier: MPL-2.0
# The Agda proof gate.  Pattern: epistemic-types .github/workflows/agda.yml —
# a digest-pinned Debian 13 container, the prover and standard library
# apt-pinned to one package version, siblings fetched at pinned commits.
#
# Every `uses:` is a full commit SHA with its tag in a comment: this
# repository's Actions policy requires SHA pinning, and a tag ref dies at
# startup with no jobs (every run of the previous version of this file).
# The lock record lives in .github/workflows/actions.lock.
name: Agda proofs
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
jobs:
  proofs:
    name: Core proofs, echo-additive instance, expected rejections, minimal-laws certificate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: debian:13-slim@sha256:a29215f6a35e51e22adffa17f89e9d2ef06214e64a2bad10d765c46aea49f11f
    steps:
      - name: Install the pinned prover and standard library
        run: |
          apt-get update
          apt-get install --no-install-recommends -y ca-certificates git agda-bin=2.6.4.3-1+b2 agda-stdlib=2.1-4
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Verify the checked Agda version
        run: test "$(agda --version)" = 'Agda version 2.6.4.3'
      - name: Fetch siblings at their pinned commits
        run: bash scripts/fetch-siblings.sh
      - name: Core proofs, echo-additive instance and expected rejections
        run: bash scripts/check.sh
      - name: Which laws K-CUT-LOSS uses
        run: bash scripts/minimal-laws.sh

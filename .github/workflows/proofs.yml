# SPDX-License-Identifier: MPL-2.0
name: Agda proofs
# DESIGNED until its first green run.  Pattern: residual-evidence-types.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  proofs:
    name: Core proofs, expected rejections, minimal-laws certificate
    runs-on: ubuntu-latest
    container: debian:trixie-slim
    steps:
      - name: Install the pinned prover
        run: |
          apt-get update
          apt-get install --no-install-recommends -y ca-certificates git agda-bin=2.6.4.3-1+b2
      - uses: actions/checkout@v6.0.3
      - name: Verify the checked Agda version
        run: test "$(agda --version)" = 'Agda version 2.6.4.3'
      - name: Fetch resource-algebra at its pinned commit
        run: bash scripts/fetch-siblings.sh
      - name: Core proofs and expected rejections
        run: bash scripts/check.sh
      - name: Which laws K-CUT-LOSS uses
        run: bash scripts/minimal-laws.sh

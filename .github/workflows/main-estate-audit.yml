# SPDX-License-Identifier: MPL-2.0
name: Central Estate CI/CD Audit

# Thin caller of the estate audit, which lives in hyperpolymath/cicd-suite as
# a reusable workflow and reports five component checks: governance,
# hygiene, manifests, languages, advisory. This is cicd-suite's
# templates/estate-audit-caller.yml.
#
# The pin is a full SHA on cicd-suite main, so upstream changes reach this
# repository only through a PR that moves it; that PR's own run of this audit
# is the check. cicd-suite's templates/track-estate-audit.yml can open those
# PRs weekly; it needs an AUTOMATION_TOKEN secret.
#
# actions.lock records this call at the pinned SHA. An untagged pin keeps the
# SHA as `ref`, which job setup accepts; move the lock record together with
# the pin, or the edge dangles and the run startup-fails with zero jobs.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  estate:
    uses: hyperpolymath/cicd-suite/.github/workflows/main-estate-audit.yml@b17ec1af1bbf097d77a58ac3363c4cf5db4d7f4a # cicd-suite main, #55

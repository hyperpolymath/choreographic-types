# SPDX-License-Identifier: PMPL-1.0-or-later
name: "🟡 CHECK: OSSF Scorecard"

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The reusable workflow's job requests actions: read (Scorecard's Packaging
# check lists workflow runs). A called job may not ask for more than its
# caller grants, so without it every run ends in startup_failure, no jobs.
permissions:
  actions: read
  contents: read
  security-events: write
  id-token: write

jobs:
  scorecard:
    name: OSSF Scorecard Check
    # Pinned by SHA, and locked in actions.lock with the four actions the
    # reusable workflow uses. Locked at @main with no such list, every
    # scheduled run died at job setup ("lockfile verification did not
    # produce a result" for upload-sarif), 2026-10-16 to 2026-10-19.
    uses: hyperpolymath/standards/.github/workflows/scorecard-reusable.yml@75bd5994470661a099df562d6d5ad2fe744dbd66
    permissions:
      actions: read
      contents: read
      security-events: write
      id-token: write

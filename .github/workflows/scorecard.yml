# SPDX-License-Identifier: PMPL-1.0-or-later
name: "🟡 CHECK: OSSF Scorecard"

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The reusable workflow's job requests actions: read (Scorecard's Packaging
# check lists workflow runs). A called job may not ask for more than its
# caller grants, so without it every run ends in startup_failure, no jobs.
permissions:
  actions: read
  contents: read
  security-events: write
  id-token: write

jobs:
  scorecard:
    name: OSSF Scorecard Check
    # Pinned by SHA, as the estate's reusable-workflow callers are; actions.lock
    # records it. Bump deliberately: it is the standards main of 2026-10-14.
    uses: hyperpolymath/standards/.github/workflows/scorecard-reusable.yml@192389bf1b40b70c594464937db7fdbf39a9a964
    permissions:
      actions: read
      contents: read
      security-events: write
      id-token: write

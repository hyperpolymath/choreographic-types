# SPDX-License-Identifier: MPL-2.0
# Only the runtime used by this pre-registration's integrity checks.
# There is no Agda, Cargo, npm-package or Go build to invoke.
[tools]
node = "22"

[tasks.check]
description = "Check documentation integrity (not mathematical proofs)"
run = "node scripts/check-repository.mjs"

[tasks.test]
description = "Run integrity and policy regression tests"
run = "node --test tests/*.test.mjs"
